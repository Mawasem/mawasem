name: Deploy Backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false

jobs:
  prepare:
    name: Build production package
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore API
        run: >
          dotnet restore
          server/Mawasem.API/Mawasem.API.csproj

      - name: Restore tests
        run: >
          dotnet restore
          server/Mawasem.Tests/Mawasem.Tests.csproj

      - name: Build API
        run: >
          dotnet build
          server/Mawasem.API/Mawasem.API.csproj
          --configuration Release
          --no-restore

      - name: Build tests
        run: >
          dotnet build
          server/Mawasem.Tests/Mawasem.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test
          server/Mawasem.Tests/Mawasem.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory "${{ github.workspace }}/test-results"

      - name: Install EF Core tool
        run: >
          dotnet tool install
          --global dotnet-ef
          --version 8.0.28

      - name: Check EF Core model
        run: >
          dotnet ef migrations has-pending-model-changes
          --project server/Mawasem.Infrastructure/Mawasem.Infrastructure.csproj
          --startup-project server/Mawasem.API/Mawasem.API.csproj
          --configuration Release
          --no-build

      - name: Create migration script
        run: |
          mkdir -p deployment-artifacts
          dotnet ef migrations script \
            --idempotent \
            --project server/Mawasem.Infrastructure/Mawasem.Infrastructure.csproj \
            --startup-project server/Mawasem.API/Mawasem.API.csproj \
            --configuration Release \
            --no-build \
            --output deployment-artifacts/migrations.sql

      - name: Publish API
        run: >
          dotnet publish
          server/Mawasem.API/Mawasem.API.csproj
          --configuration Release
          --no-build
          --output publish

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-package
          path: publish
          if-no-files-found: error
          retention-days: 14

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: backend-database-migration
          path: deployment-artifacts/migrations.sql
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-deployment-test-results
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy to Azure App Service
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: backend-production-package
          path: publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Verify production health
        shell: bash
        run: |
          base_url="${{ vars.AZURE_WEBAPP_BASE_URL }}"

          if [ -z "$base_url" ]; then
            echo "AZURE_WEBAPP_BASE_URL is not configured."
            exit 1
          fi

          base_url="${base_url%/}"

          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "${base_url}/health/ready"; then
              echo
              echo "Production readiness check passed."
              exit 0
            fi

            echo "Health attempt ${attempt} failed; retrying..."
            sleep 10
          done

          echo "Production readiness check failed."
          exit 1

      - name: Sign out of Azure
        if: always()
        run: az logout